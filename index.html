<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Default theme: dark on phones and in the mobile apps, light on computers.
         The light/dark toggle choice is remembered on that device (theme-v2). -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme-v2"); } catch (e) {}
        var cap = window.Capacitor;
        var isApp = !!(cap && (cap.isNativePlatform ? cap.isNativePlatform() : cap.isNative));
        var isPhone = window.matchMedia && window.matchMedia("(max-width: 767.98px)").matches;
        var dark = t ? t === "dark" : (isApp || isPhone);
        if (dark) document.documentElement.classList.add("dark");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0a0f1b" : "#ffffff");
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MAPL Tasks" />
    <!-- Preload both logo variants so the theme toggle swaps instantly -->
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="preload" as="image" href="/logo-dark.png" />
    <title>Magic Aisles</title>
    <meta name="description" content="Magic Aisles - Organize work. Track everything.">
    <meta name="author" content="Magic Aisles" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png">

    <meta property="og:title" content="Magic Aisles">
    <meta name="twitter:title" content="Magic Aisles">
    <meta property="og:description" content="Magic Aisles - Organize work. Track everything.">
    <meta name="twitter:description" content="Magic Aisles - Organize work. Track everything.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
