# ─────────────────────────────────────────────────────────────────────────────
#  build-windows-exe.yml
#  Builds the Magic Aisles Windows installer (.exe) on a GitHub-hosted
#  Windows runner using NSIS. No code-signing required — Windows SmartScreen
#  may warn on first run; users can click "More info → Run anyway".
#
#  Triggers:
#    • Manually from GitHub → Actions tab → "Build Windows .exe" → Run workflow
#    • Automatically when a commit is pushed to main that changes
#      package.json, electron/, src/, vite.config.ts, or index.html
#
#  Output:
#    • Artifact named "MagicAisles-Windows-Installer" containing
#      "Magic Aisles Setup <version>.exe". Download from the workflow run page.
# ─────────────────────────────────────────────────────────────────────────────

name: Build Windows .exe

on:
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "src/**"
      - "vite.config.ts"
      - "index.html"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Vite bundle + Electron .exe
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicAisles-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
